name: Android verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore v0.3 engineering debug keystore
        if: github.event_name != 'pull_request'
        env:
          MC_DEBUG_KEYSTORE_BASE64: ${{ secrets.MC_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$MC_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "MC_DEBUG_KEYSTORE_BASE64 must be configured for push/manual v0.5.1 artifacts." >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$MC_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null
          {
            echo "MC_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore"
            echo "MC_DEBUG_STORE_PASSWORD=android"
            echo "MC_DEBUG_KEY_ALIAS=androiddebugkey"
            echo "MC_DEBUG_KEY_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Verify and assemble
        run: ./scripts/build-apks.sh

      - name: Verify v0.5.1 artifact gate
        if: github.event_name != 'pull_request'
        env:
          MC_EXPECTED_V03_CERT_SHA256: 7978094b10c81a65669d7cc077d15f350b37312d2c04abd73c6667da26c5fad4
          MC_EXPECTED_VERSION_NAME: 0.5.1
          MC_EXPECTED_VERSION_CODE: 8
        run: ./scripts/verify-v04-artifact.sh

      - name: Verify unsigned release variants and debug-only xDrip isolation
        run: |
          ./gradlew \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            --no-configuration-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            :phone:lintRelease \
            :wear:lintRelease \
            :watchface:lintRelease \
            :phone:assembleRelease \
            :wear:assembleRelease \
            :watchface:assembleRelease

          mapfile -t release_manifests < <(
            find phone/build/intermediates \
              -type f \
              -name AndroidManifest.xml \
              -path '*release*' \
              -print |
              sort
          )
          if (( ${#release_manifests[@]} == 0 )); then
            echo "No merged or packaged phone release manifest was generated." >&2
            exit 1
          fi
          if grep -nE \
            'com\.eveningoutpost\.dexdrip\.(permissions\.RECEIVE_BG_ESTIMATE|BgEstimate)' \
            "${release_manifests[@]}"; then
            echo "Unofficial xDrip broadcast exposure leaked into a release manifest." >&2
            exit 1
          fi

      - name: Record v0.5.1 artifact metadata
        if: github.event_name != 'pull_request'
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          phone_apk="artifacts/metabolic-coach-phone-debug.apk"
          wear_apk="artifacts/metabolic-coach-wear-debug.apk"
          watchface_apk="artifacts/metabolic-coach-watchface-debug.apk"
          certificate="$($apksigner verify --verbose --print-certs "$phone_apk" 2>&1 |
            sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          {
            echo "### v0.5.1 debug artifact"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: \`$GITHUB_RUN_ID\`"
            echo "- Signing certificate SHA-256: \`$certificate\`"
            echo
            echo '```text'
            sha256sum "$phone_apk" "$wear_apk" "$watchface_apk" \
              artifacts/MetabolicCoach-v0.5.1.zip
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload v0.5.1 debug artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metabolic-coach-v0.5.1-debug-${{ github.sha }}
          path: |
            artifacts/metabolic-coach-phone-debug.apk
            artifacts/metabolic-coach-wear-debug.apk
            artifacts/metabolic-coach-watchface-debug.apk
            artifacts/MetabolicCoach-v0.5.1.zip
          if-no-files-found: error
