name: Android verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify and assemble
        run: ./scripts/build-apks.sh

      - name: Verify unsigned release variants and debug-only xDrip isolation
        run: |
          ./gradlew \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            --no-configuration-cache \
            -Pkotlin.compiler.execution.strategy=in-process \
            :phone:lintRelease \
            :wear:lintRelease \
            :watchface:lintRelease \
            :phone:assembleRelease \
            :wear:assembleRelease \
            :watchface:assembleRelease

          mapfile -t release_manifests < <(
            find phone/build/intermediates \
              -type f \
              -name AndroidManifest.xml \
              -path '*release*' \
              -print |
              sort
          )
          if (( ${#release_manifests[@]} == 0 )); then
            echo "No merged or packaged phone release manifest was generated." >&2
            exit 1
          fi
          if grep -nE \
            'com\.eveningoutpost\.dexdrip\.(permissions\.RECEIVE_BG_ESTIMATE|BgEstimate)' \
            "${release_manifests[@]}"; then
            echo "Unofficial xDrip broadcast exposure leaked into a release manifest." >&2
            exit 1
          fi

      - name: Upload debug APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metabolic-coach-debug-apks
          path: artifacts/*.apk
          if-no-files-found: error
